name: TestFlight

# Uploads a build to TestFlight on every push — this is the channel the app is
# installed from. ios.yml still builds the ad-hoc .ipa behind the install link,
# but only when asked: that route is the fallback for when something needs to be
# on the phone in five minutes instead of waiting for Apple to process a build.
#
# Same certificate as ios.yml — only the provisioning profile and the export
# method differ (app-store instead of ad-hoc, so no device list is baked in).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']

concurrency:
  group: testflight
  # Never abandon a half-finished upload: pushes queue instead of cancelling, so
  # a run that is already talking to Apple always gets to finish.
  cancel-in-progress: false

jobs:
  upload:
    # NOT macos-15, which ios.yml uses: Apple refuses any upload built with an SDK
    # older than iOS 26, and that image's newest Xcode is 16.x (iOS 18.5). The
    # ad-hoc pipeline is unaffected — nothing validates those builds — so it stays
    # on the image it is known to work on.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.yannick.stickerstudio
      TEAM_ID: P46A3LB6LF
      # Not a secret — it is on every App Store URL. Passing it explicitly is what
      # lets the upload skip Apple's app-lookup endpoint entirely.
      APPLE_ID: '6794895578'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pick the newest Xcode on the image rather than whatever /Applications/Xcode.app
      # happens to point at, then prove the SDK is new enough BEFORE spending
      # twenty minutes on an archive Apple will reject at the last step.
      - name: Select the newest Xcode and check the SDK
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          echo "Using $NEWEST"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK = $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::This runner's newest iOS SDK is $SDK. Apple rejects any upload built with less than iOS 26 — the runner image needs to be newer."
            exit 1
          fi

      # App Store Connect rejects a build whose number it has seen before for this
      # version, so it has to rise on every upload. This workflow's own run number
      # does that, and is independent of the ad-hoc pipeline's numbering.
      - name: Stamp build number
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('buildNumber =', cfg.expo.ios.buildNumber);
          "

      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/dist.p12
          echo "CODESIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)"/\1/')" >> $GITHUB_ENV

      # The App Store profile, not the ad-hoc one: it carries no device list, so
      # the build installs for anyone invited to TestFlight.
      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          PLIST=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          cp $RUNNER_TEMP/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          # An ad-hoc profile would build and upload fine and then fail review with
          # "invalid provisioning" — catch the mix-up here instead.
          if echo "$PLIST" | grep -q ProvisionedDevices; then
            echo "::error::That profile lists devices — it is ad-hoc, not App Store."
            exit 1
          fi
          echo "Installed App Store profile $UUID"

      - name: Archive
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
            -quiet

      - name: Export .ipa for the App Store
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -quiet
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --help 2>&1 | head -30 || true
          # altool looks for the key by name in this exact directory.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          SHORT=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")

          # --upload-app resolves the bundle id to an Apple ID by calling Apple's
          # list-apps endpoint. That endpoint went down for a night and took every
          # build with it, reported as the thoroughly misleading "Cannot determine
          # the Apple ID from Bundle ID". --upload-package is handed the Apple ID
          # and the versions outright, so it never makes that call.
          #
          # If this altool has no --upload-package, the first attempt says so and
          # we drop back to --upload-app rather than guessing in advance.
          MODE=package
          upload_once() {
            if [ "$MODE" = package ]; then
              xcrun altool --upload-package "$IPA" --type ios \
                --apple-id "$APPLE_ID" --bundle-id "$BUNDLE_ID" \
                --bundle-version "$BUILD" --bundle-short-version-string "$SHORT" \
                --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1
            else
              xcrun altool --upload-app -f "$IPA" -t ios \
                --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1
            fi
          }

          ok=0
          for attempt in 1 2 3 4 5; do
            echo "--- upload attempt $attempt (mode: $MODE)"
            if OUT=$(upload_once); then
              echo "$OUT"; ok=1; break
            fi
            echo "$OUT"
            # This altool predates --upload-package: switch and try again at once.
            if [ "$MODE" = package ] && echo "$OUT" | grep -qiE "unrecognized|unknown option|^usage:|invalid option"; then
              echo "--upload-package not supported here; falling back to --upload-app"
              MODE=app
              continue
            fi
            # A build number Apple has already accepted is a success, not a retry:
            # trying again would only ever produce the same rejection.
            if echo "$OUT" | grep -qiE "already.*(used|exist)|redundant binary"; then
              echo "Apple already has this build."; ok=1; break
            fi
            # Anything that is plainly about THIS binary will not fix itself.
            if echo "$OUT" | grep -qiE "Validation failed|Invalid|ITMS-"; then
              echo "::error::The binary itself was rejected — retrying would not help."
              break
            fi
            [ "$attempt" -lt 5 ] && { echo "transient; waiting 120s"; sleep 120; }
          done

          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          [ "$ok" = 1 ] || exit 1
          echo "Uploaded. Apple processes the build for a few minutes before it"
          echo "appears in TestFlight."
