name: iOS build

# Builds a signed ad-hoc .ipa on GitHub's macOS runners (free for public repos)
# and publishes an install page you can open on the iPhone. No Mac required
# locally, and no dependency on EAS's build quota.
#
# Manual now that TestFlight is the normal way the app gets onto the phone. Kept
# because it is the faster of the two — no processing wait at Apple's end — and
# because it is the way back in if anything on the TestFlight side breaks.

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # create the release that hosts the .ipa

    env:
      BUNDLE_ID: com.yannick.stickerstudio
      TEAM_ID: P46A3LB6LF
      PROFILE_NAME: Sticker Studio Adhoc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Every build needs its own build number: iOS will not replace an installed
      # app that reports the same version AND build, so without this each new
      # release silently no-ops on the device.
      - name: Stamp build number
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('buildNumber =', cfg.expo.ios.buildNumber);
          "

      # Generate the native iOS project from the Expo config (we don't keep ios/
      # in the repo — it's derived, exactly like EAS does it).
      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install

      # Assert, don't just print: without this the missing-build-number bug
      # (which made iOS silently refuse to install new builds) comes back unnoticed.
      - name: Verify build number reached the app
        run: |
          set -euo pipefail
          PLIST=$(ls ios/*/Info.plist | head -1)
          GOT=$(plutil -extract CFBundleVersion raw "$PLIST")
          echo "CFBundleVersion=$GOT  CFBundleShortVersionString=$(plutil -extract CFBundleShortVersionString raw "$PLIST")"
          if [ "$GOT" != "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::CFBundleVersion is '$GOT' but should be '$GITHUB_RUN_NUMBER' — iOS would not replace the installed app."
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # Signing: load the distribution certificate into a temporary keychain and
      # drop the provisioning profile where Xcode looks for it.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/dist.p12
          echo "CODESIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)"/\1/')" >> $GITHUB_ENV

      - name: Install provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXT_ADHOC_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          install_profile() {
            local label=$1 b64=$2 envvar=$3
            echo "$b64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
            UUID=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision | plutil -extract UUID raw -)
            cp $RUNNER_TEMP/profile.mobileprovision \
              ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "$envvar=$UUID" >> $GITHUB_ENV
            echo "Installed $label profile $UUID"
          }
          install_profile "App" "$PROFILE_BASE64" PROFILE_UUID
          install_profile "ShareExtension" "$SHARE_PROFILE_BASE64" SHARE_PROFILE_UUID

      - name: Assign provisioning profiles to targets
        run: |
          PBXPROJ=$(ls ios/*.xcodeproj/project.pbxproj | head -1)
          python3 - "$PBXPROJ" "$PROFILE_UUID" "$SHARE_PROFILE_UUID" "$BUNDLE_ID" "$TEAM_ID" <<'PYEOF'
          import sys, re

          path = sys.argv[1]
          app_profile = sys.argv[2]
          ext_profile = sys.argv[3]
          bundle_id = sys.argv[4]
          team_id = sys.argv[5]
          ext_bundle_id = bundle_id + ".share-extension"

          with open(path) as f:
              text = f.read()

          def patch_build_settings(m):
              block = m.group(0)
              is_ext = "ShareExtension" in block or ext_bundle_id in block
              profile = ext_profile if is_ext else app_profile
              if "PROVISIONING_PROFILE_SPECIFIER" in block:
                  block = re.sub(
                      r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*"',
                      f'PROVISIONING_PROFILE_SPECIFIER = "{profile}"',
                      block)
              else:
                  block = block.replace(
                      "buildSettings = {",
                      f'buildSettings = {{\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";', 1)
              if "CODE_SIGN_STYLE" in block:
                  block = re.sub(r'CODE_SIGN_STYLE = \w+', 'CODE_SIGN_STYLE = Manual', block)
              else:
                  block = block.replace(
                      "buildSettings = {",
                      'buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;', 1)
              if "DEVELOPMENT_TEAM" in block:
                  block = re.sub(r'DEVELOPMENT_TEAM = "[^"]*"', f'DEVELOPMENT_TEAM = "{team_id}"', block)
                  block = re.sub(r'DEVELOPMENT_TEAM = \w+', f'DEVELOPMENT_TEAM = {team_id}', block)
              if is_ext and "PRODUCT_BUNDLE_IDENTIFIER" not in block:
                  block = block.replace(
                      "buildSettings = {",
                      f'buildSettings = {{\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = "{ext_bundle_id}";', 1)
              return block

          text = re.sub(
              r'buildSettings = \{[^}]*\}',
              patch_build_settings,
              text,
              flags=re.DOTALL)

          with open(path, 'w') as f:
              f.write(text)
          print("Patched provisioning profiles and bundle IDs")
          PYEOF

      - name: Archive
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
            -quiet

      - name: Export .ipa
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
              <key>${BUNDLE_ID}.share-extension</key><string>$SHARE_PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -quiet
          ls -lh "$RUNNER_TEMP/export"

      - name: Prepare release assets
        id: assets
        run: |
          mkdir -p dist
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          cp "$IPA" dist/StickerStudio.ipa
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          TAG="ios-${VERSION}-${BUILD}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # Over-the-air install manifest (itms-services) so the iPhone can install
          # straight from Safari, the same way the EAS install page works.
          cat > dist/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>${BASE}/StickerStudio.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
              <key>bundle-version</key><string>${BUILD}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Sticker Studio</string>
            </dict>
          </dict></array></dict></plist>
          PLIST

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: Sticker Studio ${{ steps.assets.outputs.tag }}
          body: |
            Ad-hoc build for registered devices.

            **Install:** open this on your iPhone —
            https://yannickjads.github.io/stickerstudio/
          files: |
            dist/StickerStudio.ipa
            dist/manifest.plist

      # The install page is the whole point of the pipeline — prove it resolves
      # and that the manifest it will fetch really points at this release.
      - name: Smoke-check the install path
        run: |
          set -euo pipefail
          curl -fsS https://yannickjads.github.io/stickerstudio/ | grep -q 'itms-services'
          MANIFEST="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.assets.outputs.tag }}/manifest.plist"
          curl -fsSL "$MANIFEST" | grep -q 'StickerStudio.ipa'
          curl -fsSLI "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.assets.outputs.tag }}/StickerStudio.ipa" > /dev/null
          echo "install page + manifest + ipa all reachable"

      - uses: actions/upload-artifact@v4
        with:
          name: StickerStudio-ipa
          path: dist/StickerStudio.ipa
